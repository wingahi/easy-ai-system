server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: ${WGH_PROFILE:dev}

  application:
    name: wgh-rag-system

  # ===== PostgreSQL 数据源（pgvector 向量化复用同一连接池） =====
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${WGH_DB_HOST:localhost}:${WGH_DB_PORT:5432}/${WGH_DB_NAME:wgh_rag}?currentSchema=public&stringtype=unspecified
    username: ${WGH_DB_USERNAME:postgres}
    password: ${WGH_DB_PASSWORD:postgres}
    hikari:
      pool-name: WghRagHikariPool
      maximum-pool-size: ${WGH_DB_POOL_MAX:20}
      minimum-idle: ${WGH_DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
      initialization-fail-timeout: -1   # 启动时连接失败不阻断

  # ===== 文件上传 =====
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 10240

  # ===== Jackson 序列化 =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

# ===== MyBatis Plus =====
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wgh.rag.**.entity
  type-aliases-super-type: com.wgh.rag.common.entity.BaseEntity
  type-handlers-package: com.wgh.rag.common.handler
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    use-generated-keys: true
    default-statement-timeout: 25
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== WGH RAG 自定义配置 =====
wgh:
  # ===== 外部 OIDC 资源服务器（本系统只验签，不签发 token） =====
  # token 由上游 IdP 签发；issuer / audience / jwks-uri 必配（jwks-uri 留空则自动发现）。
  auth:
    oidc:
      issuer: ${WGH_OIDC_ISSUER:}
      audience: ${WGH_OIDC_AUDIENCE:}
      jwks-uri: ${WGH_OIDC_JWKS_URI:}
      roles-claim: ${WGH_OIDC_ROLES_CLAIM:roles}
      username-claim: ${WGH_OIDC_USERNAME_CLAIM:sub}
      default-role: viewer
      clock-skew-seconds: 30
      jwks-cache-ttl-seconds: 300
      jwks-refresh-min-interval-seconds: 30
      # IdP claim 值 → 本系统 wgh_role.role_code；未命中映射时按 claim 原值匹配
      role-mapping: {}
      # role-mapping:
      #   "wgh-admin": admin
      #   "wgh-editor": editor
      #   "wgh-viewer": viewer


  pgvector:
    default-dimension: 1536
    create-table: true
    skip-create-vector-extension: ${WGH_PGVECTOR_SKIP_EXT:false}   # DB 侧没装 pgvector 时设为 true，由 DBA 预先执行 CREATE EXTENSION vector
    use-index: false                                              # >10万条数据时开启 IVFFlat
    index-list-size: 100
    default-table-name: rag_vector_store
    connect-on-startup: true
    allow-fallback-to-in-memory: ${WGH_PGVECTOR_FALLBACK:false}
  
  rag:
    retrieve:
      top-k: 5
      min-score: 0.3
      enable-rerank: false
    split:
      max-length: 512
      overlap-length: 64
      default-strategy: AUTO
    context:
      max-history-messages: 20                                   # 超过此条数触发分层压缩
      max-history-tokens: 4000
      enable-compression: true
      recent-window-rounds: 4                                   # 分层压缩：近期窗口（轮，保留原文）
      mid-term-window-rounds: 6                                 # 分层压缩：中期窗口（轮，LLM 摘要）
      long-term-facts-tokens: 400                               # 分层压缩：远期对话 Token 预算（关键事实）
      summary-max-tokens: 600                                   # 分层压缩：LLM 摘要最大输出 Token
      summary-timeout-seconds: 20                               # 分层压缩：摘要 LLM 调用超时（秒）
    cache:
      enabled: ${WGH_CACHE_ENABLED:true}                        # 语义缓存全局开关（窗口级需同时开启）
      similarity-threshold: ${WGH_CACHE_THRESHOLD:0.95}         # 命中阈值（余弦相似度，越高越严格）
      max-per-window: ${WGH_CACHE_MAX_PER_WINDOW:500}           # 每窗口最大缓存条数，超出删最旧
    quota:
      # 全局默认配额：用户无自定义配置或自定义配置被禁用时生效（<=0 表示不限制）
      chat-daily-limit: ${WGH_QUOTA_CHAT_DAILY_LIMIT:200}       # 每人每天对话条数上限
      token-daily-limit: ${WGH_QUOTA_TOKEN_DAILY_LIMIT:2000000} # 每人每天 token 上限
  
  file:
    upload-dir: ${WGH_UPLOAD_DIR:./uploads}
    max-single-file-mb: 50

  # ===== 免登录分享 / Widget / 开放 API =====
  public-access:
    share-max-expire-days: 30          # 分享链接有效期上限（天）
    share-default-expire-days: 7       # 未指定有效期时的默认天数
    share-rate-limit-per-minute: 20    # 分享入口每分钟请求上限（按 token + IP）
    api-rate-limit-per-minute: 60      # 开放 API 每分钟请求上限（按 API Key）
    max-images-per-request: 4          # 分享/开放 API 单次提问图片数量上限

  skill:
    # Skill 目录根路径（directory 模式从这里扫描/导入/写入）
    base-path: ${WGH_SKILL_BASE_PATH:./skills}

# ===== LangChain4j =====
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout: 60s
      log-requests: false
      log-responses: false
    streaming-chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout: 120s
    embedding-model:
      api-key: ${OPENAI_API_KEY:demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: text-embedding-3-small
      timeout: 30s

# ===== Actuator (健康检查) =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ===== Logback 级别 =====
logging:
  level:
    root: INFO
    com.wgh.rag: ${WGH_LOG_LEVEL:DEBUG}
    com.baomidou.mybatisplus: INFO
    dev.langchain4j: ${WGH_LLM_LOG:INFO}
    org.postgresql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
