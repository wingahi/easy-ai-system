server:
  port: 8080
  servlet:
    context-path: /
  # ===== 优雅停机（K8s 滚动更新 / SIGTERM）=====
  # 收到 SIGTERM 后停止接收新连接，等在途请求（含 SSE 长连接）自然结束再退出；
  # 超时由 spring.lifecycle.timeout-per-shutdown-phase 控制，须小于 Pod 的
  # terminationGracePeriodSeconds 减去 preStop 时长。
  shutdown: graceful

spring:
  profiles:
    active: ${WGH_PROFILE:dev}

  application:
    name: wgh-rag-system

  # ===== 功能开关与运行参数（独立文件，值=代码默认值，行为与未配置一致）=====
  # 文件不存在时不影响启动；profile 专属配置与本文件中的显式键仍可覆盖其默认值。
  config:
    import: optional:classpath:application-features.yml

  # ===== PostgreSQL 数据源（pgvector 向量化复用同一连接池） =====
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${WGH_DB_HOST:localhost}:${WGH_DB_PORT:5432}/${WGH_DB_NAME:wgh_rag_dev}?currentSchema=public&stringtype=unspecified
    username: ${WGH_DB_USERNAME:postgres}
    password: ${WGH_DB_PASSWORD:postgres}
    hikari:
      pool-name: WghRagHikariPool
      maximum-pool-size: ${WGH_DB_POOL_MAX:20}
      minimum-idle: ${WGH_DB_POOL_MIN:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
      initialization-fail-timeout: -1   # 启动时连接失败不阻断

  # ===== 文件上传 =====
  servlet:
    multipart:
      max-file-size: 200MB
      # 比单文件上限留 10MB 余量给 multipart 边界与表单字段
      max-request-size: 210MB
      file-size-threshold: 10240

  # ===== Jackson 序列化 =====
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: Asia/Shanghai

  # 优雅停机单阶段最长等待时间：需小于 Pod terminationGracePeriodSeconds - preStop。
  # 超出后强制关闭剩余连接（SSE 事件重放未实现，超长连接仍会被断开）。
  lifecycle:
    timeout-per-shutdown-phase: 45s

# ===== MyBatis Plus =====
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.wgh.rag.**.entity
  type-aliases-super-type: com.wgh.rag.data.entity.BaseEntity
  type-handlers-package: com.wgh.rag.data.handler
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    use-generated-keys: true
    default-statement-timeout: 25
    call-setters-on-nulls: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===== WGH RAG 自定义配置 =====
wgh:
  # ===== 平台级全租户扫描（连接器同步、对账、续跑扫描、配额退款、各类清理共用） =====
  # 维护作业按 wgh_tenant 枚举租户逐户执行；单租户失败只告警不中断整轮。
  platform-scan:
    enabled: ${WGH_PLATFORM_SCAN_ENABLED:true}
    tenant-concurrency: ${WGH_PLATFORM_SCAN_CONCURRENCY:1}   # 1=串行
    max-tenants-per-round: ${WGH_PLATFORM_SCAN_MAX_TENANTS:200}
    statement-timeout: ${WGH_PLATFORM_SCAN_STATEMENT_TIMEOUT:5s}

  # ===== 统一异步执行器（替代裸 new Thread；有界队列 + 显式拒绝） =====
  async:
    executor:
      core-size: ${WGH_ASYNC_CORE:8}
      max-size: ${WGH_ASYNC_MAX:32}
      queue-capacity: ${WGH_ASYNC_QUEUE:200}
      keep-alive-seconds: 60
      thread-name-prefix: rag-async-
      await-termination-seconds: 30
      caller-runs: false   # true=饱和回退提交线程（可能阻塞请求线程），默认显式拒绝

  # ===== 数据库方言（仅影响 MyBatis-Plus 分页语法，默认 PostgreSQL） =====
  db:
    dialect: ${WGH_DB_DIALECT:postgresql}

  # ===== CORS（业务接口来源白名单）=====
  # 仅列出的来源可跨域访问业务接口；/api/public/**（Widget 嵌入、分享页）保持跨域开放且不携带凭证。
  # 生产环境必须通过 WGH_CORS_ALLOWED_ORIGINS 配置实际前端域名（逗号分隔）。
  security:
    cors:
      allowed-origins: ${WGH_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
      allow-credentials: ${WGH_CORS_ALLOW_CREDENTIALS:false}   # Bearer Token 模式无需开启

  # ===== 多租户（阶段 1：上下文与身份归属；租户传入只认凭证，不认请求参数） =====
  tenant:
    # true=严格模式：缺失/未知/停用租户的令牌与 API Key 一律拒绝；
    # false=兼容存量单租户部署，未知租户回落 default。多租户上线前必须置为 true。
    enforcement: ${WGH_TENANT_ENFORCEMENT:false}
    # true=MyBatis 插件自动为租户表追加 tenant_id 条件（依赖 06_tenant_data_plane.sql 已执行）；
    # 仅在租户列迁移未完成、需要紧急回滚时置为 false。
    sql-isolation-enabled: ${WGH_TENANT_SQL_ISOLATION:true}
    # true=事务开始时对连接下发 set_config('app.tenant_id', ?, true)（RLS 生效前提）；
    # 关闭仅用于故障回滚，关闭后 RLS 会拒绝所有带策略的租户表访问。
    guc-enabled: ${WGH_TENANT_GUC_ENABLED:true}
    # true=免登录（wgh_preauth）与调度（wgh_scheduler）链路在独立事务内 SET LOCAL ROLE；
    # 连接用户仍是应用角色，需要该角色在这两个专用角色上具备成员关系（见 09_rls_roles.sql）。
    role-switch-enabled: ${WGH_TENANT_ROLE_SWITCH:true}
    # true=启动自检发现 superuser / BYPASSRLS / INHERIT 时直接启动失败。
    # dev 切换 wgh_app 并验证通过后置为 true；当前保持 false 只告警。
    database-role-check-enforced: ${WGH_TENANT_DB_ROLE_ENFORCED:false}

  # ===== 外部 OIDC 资源服务器（本系统只验签，不签发 token） =====
  # token 由上游 IdP 签发；issuer / audience / jwks-uri 必配（jwks-uri 留空则自动发现）。
  auth:
    # 用户信息缓存（按 userId 维度；仅身份/账号状态字段，不含密码哈希与额度/用量计数）
    # Redis 不可用时自动降级为直读数据库，不影响登录态校验
    user-cache:
      enabled: ${WGH_AUTH_USER_CACHE_ENABLED:true}
      ttl: ${WGH_AUTH_USER_CACHE_TTL:30m}
      lock-wait-timeout: ${WGH_AUTH_USER_CACHE_LOCK_WAIT:200ms}
    oidc:
      issuer: ${WGH_OIDC_ISSUER:}
      audience: ${WGH_OIDC_AUDIENCE:}
      jwks-uri: ${WGH_OIDC_JWKS_URI:}
      roles-claim: ${WGH_OIDC_ROLES_CLAIM:roles}
      username-claim: ${WGH_OIDC_USERNAME_CLAIM:sub}
      tenant-claim: ${WGH_OIDC_TENANT_CLAIM:tenant}
      default-role: viewer
      clock-skew-seconds: 30
      jwks-cache-ttl-seconds: 300
      jwks-refresh-min-interval-seconds: 30
      # 多实例共享 JWKS 缓存（复用 wgh.rag.redis；Redis 不可用时自动回退本地缓存 + 回源）
      jwks-shared-cache-enabled: ${WGH_OIDC_JWKS_SHARED_CACHE:true}
      # IdP claim 值 → 本系统 wgh_role.role_code；未命中映射时按 claim 原值匹配
      role-mapping: {}
      # role-mapping:
      #   "wgh-admin": admin
      #   "wgh-editor": editor
      #   "wgh-viewer": viewer


  pgvector:
    default-dimension: 1536
    create-table: true
    skip-create-vector-extension: ${WGH_PGVECTOR_SKIP_EXT:false}   # DB 侧没装 pgvector 时设为 true，由 DBA 预先执行 CREATE EXTENSION vector
    # LangChain4j 内置 IVFFlat 开关：本项目统一用下面的 HNSW，保持 false 避免双 ANN 索引
    use-index: false
    index-list-size: 100
    # HNSW 索引（pgvector >= 0.5.0）：知识库建表/入库时幂等创建；历史表见 schema.sql 末尾补建块
    use-hnsw-index: ${WGH_PGVECTOR_HNSW:true}
    hnsw-m: 16                                                    # 每节点最大邻居数（越大召回越高、内存越大）
    hnsw-ef-construction: 64                                      # 构建候选列表（越大建索引越慢、质量越好）
    store-cache-max-size: 64                                      # EmbeddingStore 句柄进程内 LRU 上限（按 表名+维度）
    default-table-name: rag_vector_store
    connect-on-startup: true
    allow-fallback-to-in-memory: ${WGH_PGVECTOR_FALLBACK:false}
  
  rag:
    # ===== 文件存储（可插拔：local 本地磁盘 / oss 阿里云对象存储）=====
    # 切换只改 type 与本段 OSS 配置，业务代码无需改动；OSS 配置为空时应用仍可启动（仅调用时返回明确错误）
    storage:
      type: ${WGH_STORAGE_TYPE:local}
      # 部署模式：single（默认，单实例，行为与未配置时一致）/ shared（多实例共享）。
      # shared 时启动自检：type=oss 要求 OSS 必填项完整；type=local 要求 base-dir 为可写的独立挂载卷。
      mode: ${WGH_STORAGE_MODE:single}
      # 迁移期兼容读（仅 type=oss 生效）：主存储未命中时回落 local.base-dir 读取旧对象；
      # 用于 local → oss 滚动切换窗口，迁移完成后关闭。
      read-fallback-enabled: ${WGH_STORAGE_READ_FALLBACK:false}
      local:
        base-dir: ${WGH_UPLOAD_DIR:./uploads}          # 本地根目录（沿用历史 WGH_UPLOAD_DIR）
        url-prefix: ${WGH_STORAGE_URL_PREFIX:/uploads} # 仅用于 resolveUrl 返回逻辑地址
        max-file-size-mb: ${WGH_STORAGE_MAX_FILE_MB:200}
      oss:
        endpoint: ${WGH_OSS_ENDPOINT:}                 # 公网 endpoint，如 https://oss-cn-hangzhou.aliyuncs.com
        internal-endpoint: ${WGH_OSS_INTERNAL_ENDPOINT:} # 可选：内网 endpoint，服务端读写优先使用
        bucket: ${WGH_OSS_BUCKET:}
        access-key-id: ${WGH_OSS_ACCESS_KEY_ID:}
        access-key-secret: ${WGH_OSS_ACCESS_KEY_SECRET:}
        key-prefix: ${WGH_OSS_KEY_PREFIX:}             # 对象 key 前缀，可为空
        public-read: ${WGH_OSS_PUBLIC_READ:false}      # false 时 resolveUrl 返回签名 URL
        signed-url-expire-minutes: ${WGH_OSS_SIGNED_URL_EXPIRE_MINUTES:60}
        max-retries: ${WGH_OSS_MAX_RETRIES:3}
        max-file-size-mb: ${WGH_STORAGE_MAX_FILE_MB:200}
    # ===== Redis（限流 / 分享密码锁定 / Widget 嵌入授权 / 跨实例取消）=====
    # Redis 不可用时不阻断启动，公开访问与取消标记自动降级为单机内存并输出 WARN；
    # 降级次数暴露为 wgh.state.store.fallbacks 指标，便于多副本部署告警。
    redis:
      enabled: ${WGH_REDIS_ENABLED:true}
      host: ${WGH_REDIS_HOST:localhost}
      port: ${WGH_REDIS_PORT:6379}
      database: ${WGH_REDIS_DATABASE:0}
      timeout: ${WGH_REDIS_TIMEOUT:2s}
      password: ${WGH_REDIS_PASSWORD:}
      # 共享状态 key 的系统命名空间根（多环境共用同一 Redis 时用于区分）
      key-prefix: ${WGH_REDIS_KEY_PREFIX:wgh}
    retrieve:
      top-k: 5
      # cosine 阈值：实测相关命中位于 0.588~0.601，0.3 会放入大量弱相关噪声；默认 0.55 与文档契约一致
      min-score: ${WGH_RAG_MIN_SCORE:0.55}
      enable-rerank: false
      # 混合检索全局默认（窗口级开启优先）；保持默认关闭，避免改变现有行为
      enable-hybrid: ${WGH_RAG_ENABLE_HYBRID:false}
      # 混合检索关键词路召回条数
      keyword-top-n: ${WGH_RAG_KEYWORD_TOP_N:10}
    split:
      max-length: 512
      overlap-length: 64
      default-strategy: AUTO
    context:
      max-history-messages: 20                                   # 超过此条数触发分层压缩
      max-history-tokens: 4000
      enable-compression: true
      recent-window-rounds: 4                                   # 分层压缩：近期窗口（轮，保留原文）
      mid-term-window-rounds: 6                                 # 分层压缩：中期窗口（轮，LLM 摘要）
      long-term-facts-tokens: 400                               # 分层压缩：远期对话 Token 预算（关键事实）
      summary-max-tokens: 600                                   # 分层压缩：LLM 摘要最大输出 Token
      summary-timeout-seconds: 20                               # 分层压缩：摘要 LLM 调用超时（秒）
      context-max-tokens: 6000                                  # 检索上下文 Token 硬上限（5×512 字≈2500，留 2.4 倍余量）
      context-window-ratio: 0.6                                 # 输入侧最多占模型窗口 60%，其余留给输出与估算误差
      fallback-window-tokens: 8192                              # 模型未配置 maxContextTokens 时的兜底窗口
      min-chunk-tokens: 120                                     # 预算耗尽时单条 chunk 最少保留 Token
    cache:
      enabled: ${WGH_CACHE_ENABLED:true}                        # 语义缓存全局开关（窗口级需同时开启）
      similarity-threshold: ${WGH_CACHE_THRESHOLD:0.95}         # 命中阈值（余弦相似度，越高越严格）
      max-per-window: ${WGH_CACHE_MAX_PER_WINDOW:500}           # 每窗口最大缓存条数，超出删最旧
      cleanup-interval-minutes: ${WGH_CACHE_CLEANUP_INTERVAL_MINUTES:30}   # 过期缓存周期清理间隔（分钟，最小 5）
    quota:
      # 全局默认配额：用户无自定义配置或自定义配置被禁用时生效（<=0 表示不限制）
      chat-daily-limit: ${WGH_QUOTA_CHAT_DAILY_LIMIT:200}       # 每人每天对话条数上限
      token-daily-limit: ${WGH_QUOTA_TOKEN_DAILY_LIMIT:2000000} # 每人每天 token 上限
      # 计数写入异常时的策略：false=拒绝本次对话（业务码 5004，避免“说了话却没扣费”）；
      # true=仅打 ALERT 日志与指标后放行（本次不扣费），仅建议 DB 短时抖动时临时开启。
      fail-open-on-count-error: ${WGH_QUOTA_FAIL_OPEN_ON_COUNT_ERROR:false}

    # ===== SSE 事件重放缓冲（依赖 wgh.rag.redis.*）=====
    # 关闭后回到「实时流 + 断连即取消」旧语义；Redis 不可用时无法跨副本重放，
    # 但客户端断开不再等同执行失败（重连请求显式报错并上报 fallback 指标）。
    stream:
      replay:
        enabled: ${WGH_STREAM_REPLAY_ENABLED:true}                              # 总开关；关闭后不写缓冲
        ttl: ${WGH_STREAM_REPLAY_TTL:35m}                                       # 活跃流缓冲 TTL（每次写入续期）
        completed-ttl: ${WGH_STREAM_REPLAY_COMPLETED_TTL:5m}                    # 流终态后的缓冲 TTL
        max-events-per-stream: ${WGH_STREAM_REPLAY_MAX_EVENTS_PER_STREAM:5000}  # 单流最多保留事件条数
        flush-interval: ${WGH_STREAM_REPLAY_FLUSH_INTERVAL:200ms}               # 事件批量刷盘间隔
        poll-interval: ${WGH_STREAM_REPLAY_POLL_INTERVAL:300ms}                 # 重连跟随轮询间隔
        poll-batch-size: ${WGH_STREAM_REPLAY_POLL_BATCH_SIZE:200}               # 单次轮询读取尾部条数
        idle-timeout: ${WGH_STREAM_REPLAY_IDLE_TIMEOUT:120s}                    # 无新事件的空闲判定阈值
        follow-timeout: ${WGH_STREAM_REPLAY_FOLLOW_TIMEOUT:29m}                 # 单次重连跟随最长时间
  
  file:
    upload-dir: ${WGH_UPLOAD_DIR:./uploads}
    max-single-file-mb: 200

  # ===== 免登录分享 / Widget / 开放 API =====
  public-access:
    share-max-expire-days: 30          # 分享链接有效期上限（天）
    share-default-expire-days: 7       # 未指定有效期时的默认天数
    share-rate-limit-per-minute: 20    # 旧版分享限流默认值（rate-limit.overrides 未命中时生效）
    api-rate-limit-per-minute: 60      # 旧版开放 API 限流默认值（rate-limit.overrides 未命中时生效）
    max-images-per-request: 4          # 分享/开放 API 单次提问图片数量上限

    # 分布式限流：按“维度 + 主体 + 接口路径”滑动窗口计数
    rate-limit:
      default-per-minute: ${WGH_RL_DEFAULT:60}
      overrides:
        share-token: ${WGH_RL_SHARE_TOKEN:20}    # 分享：token + IP
        share-ip: ${WGH_RL_SHARE_IP:60}          # 分享：单 IP
        share-chat: ${WGH_RL_SHARE_CHAT:20}      # 分享：聊天接口
        share-kb: ${WGH_RL_SHARE_KB:20}          # 分享：知识库检索接口
        share-embed: ${WGH_RL_SHARE_EMBED:30}    # Widget 嵌入授权
        api-key: ${WGH_RL_API_KEY:60}            # 开放 API：单个 Key
        api-ip: ${WGH_RL_API_IP:120}             # 开放 API：单 IP

    # 分享密码失败锁定（计数按 token + 客户端 IP 存 Redis）
    share-password:
      max-failures: ${WGH_SHARE_PWD_MAX_FAILURES:5}
      lock-minutes: ${WGH_SHARE_PWD_LOCK_MINUTES:15}
      reset-on-success: ${WGH_SHARE_PWD_RESET_ON_SUCCESS:true}

    embed:
      grant-ttl-minutes: ${WGH_EMBED_GRANT_TTL_MINUTES:30}

    # 可信反向代理 CIDR；为空时不采信任何 X-Forwarded-For / X-Real-IP
    trusted-proxies: []

  skill:
    # Skill 目录根路径（directory 模式从这里扫描/导入/写入）
    base-path: ${WGH_SKILL_BASE_PATH:./skills}

# ===== LangChain4j =====
langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout: 60s
      log-requests: false
      log-responses: false
    streaming-chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      timeout: 120s
    embedding-model:
      api-key: ${OPENAI_API_KEY:demo}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model-name: text-embedding-3-small
      timeout: 30s

# ===== Actuator (健康检查 / 指标) =====
# 管理端口独立于业务端口：业务端口不再暴露 /actuator，便于网络层隔离与抓取
management:
  server:
    port: ${WGH_MANAGEMENT_PORT:9090}
    # 默认监听全部网卡以支持容器内 Prometheus 抓取；生产建议通过
    # WGH_MANAGEMENT_ADDRESS 绑定内网网卡或配合防火墙限制来源
    address: ${WGH_MANAGEMENT_ADDRESS:0.0.0.0}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      # ===== K8s 探针分组 =====
      # liveness 只反映进程自身活性（ApplicationAvailability），不聚合 DB/Redis，
      # 避免依赖抖动导致容器被反复重启；readiness 在启动完成（readinessState）的
      # 基础上叠加关键依赖 db。Redis 可降级、磁盘余量不阻断服务，均不纳入 readiness。
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      # 多副本时用于区分实例指标序列；K8s 下默认取 Pod 名（HOSTNAME）
      wgh.instance: ${WGH_INSTANCE_ID:${HOSTNAME:local}}
  # ===== 分布式链路追踪 =====
  # 未配置采集端时仅在本机生成 traceId/spanId 并写入日志，不发起任何网络请求；
  # 接入 OTLP/Zipkin 采集端时再追加对应 exporter 依赖即可。
  tracing:
    enabled: ${WGH_TRACING_ENABLED:true}
    sampling:
      # 1.0 = 全量采样，保证每个请求都有 traceId 可排查；高吞吐场景可调低
      probability: ${WGH_TRACING_SAMPLING_PROBABILITY:1.0}

# ===== Logback 级别 =====
logging:
  level:
    root: INFO
    com.wgh.rag: ${WGH_LOG_LEVEL:DEBUG}
    com.baomidou.mybatisplus: INFO
    dev.langchain4j: ${WGH_LLM_LOG:INFO}
    org.postgresql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [rid=%X{requestId:--}] [trace=%X{traceId:--}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [rid=%X{requestId:--}] [trace=%X{traceId:--}] %-5level %logger{36} - %msg%n"
