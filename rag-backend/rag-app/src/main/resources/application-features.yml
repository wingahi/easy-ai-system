# =====================================================================
# 功能开关与运行参数（独立配置文件）
# ---------------------------------------------------------------------
# 由 application.yml 的 spring.config.import 引入：
#   spring.config.import: optional:classpath:application-features.yml
#
# 约定：
#   1. 本文件所有值均等于对应 @ConfigurationProperties / @Value 的代码默认值，
#      引入后行为与“完全不配置”一致；需要覆盖时改本文件或用环境变量。
#   2. 空值/空串默认项（wgh.sandbox.work-root、wgh.rag.memory.summary-model-id）
#      不搬入本文件，保留在代码中，避免 YAML 空值绑定改变既有语义。
#   3. 键名与配置类前缀严格对应，注释标注所属类，便于定位。
# =====================================================================
wgh:

  # -------------------------------------------------------------------
  # 中断续跑扫描（ResumeProperties，前缀 wgh.resume）
  # 识别长时间无活动的 RUNNING run，投递 RUN_RESUME 作业；仅在调度中心启用时生效。
  # -------------------------------------------------------------------
  resume:
    enabled: ${WGH_RESUME_ENABLED:true}   # 中断扫描总开关
    stale-minutes: 30                    # 最后活动超过该分钟数视为中断候选
    batch-size: 20                        # 每轮最多投递的续跑作业数
    scan-interval: 5m                     # 扫描间隔

  # -------------------------------------------------------------------
  # 统一调度中心（SchedulerProperties，前缀 wgh.scheduler）
  # 交互式进程内执行、后台落作业表按租约执行、维护走 Redis 单飞；
  # 启用前需先执行 sql/migrations/20261120/01_execution_job.sql。
  # -------------------------------------------------------------------
  scheduler:
    enabled: ${WGH_SCHEDULER_ENABLED:true}      # 总开关；关闭后不创建车道线程池与调度循环
    instance-id: ${WGH_INSTANCE_ID:}            # 留空时取 HOSTNAME-pid，用于租约归属与单飞锁

    lease-ttl: 60s                              # 作业租约 TTL；持有者需在到期前续租
    heartbeat-interval: 10s                     # 续约与取消轮询间隔，须显著小于 lease-ttl
    claim-interval: 2s                          # 后台车道领取作业轮询间隔
    reclaim-interval: 30s                       # 租约过期回收扫描间隔
    queue-sweep-interval: 15s                   # 排队超时扫描间隔

    default-timeout: 30m                        # 单次执行默认超时（请求未指定时）
    queue-timeout: 5m                           # 后台作业排队超时；超时落 FAILED 且不重试
    retry-backoff: 30s                          # 失败重试退避基数（按尝试次数线性递增）
    max-attempts: 3                             # 默认最大尝试次数（含首次）
    event-retention: 5m                         # 终态事件保留时长（供本实例 attach 重放）
    event-table-retention: ${WGH_SCHEDULER_EVENT_TABLE_RETENTION:7d}   # 事件表保留期（跨实例 Last-Event-ID 重放）
    tenant-max-concurrent: 2                    # 单租户后台并发上限（策略表无覆盖时的兜底值）

    # ===== 租户调度策略（需先执行 sql/migrations/20261124/04_tenant_schedule_policy.sql）=====
    anonymous-tenant-id: ${WGH_SCHEDULER_ANONYMOUS_TENANT:default}      # 空租户统一落该桶
    policy-refresh-interval: ${WGH_SCHEDULER_POLICY_REFRESH_INTERVAL:30s}   # 策略本地缓存刷新间隔
    slot-reconcile-interval: ${WGH_SCHEDULER_SLOT_RECONCILE_INTERVAL:1m}    # 运行槽与作业表对账间隔
    default-policy:
      interactive:
        max-concurrent: 2                       # 运行中并发上限
        max-queue: 20                           # 等待中排队上限
        weight: 10                              # 公平调度权重（1-100）
        priority-boost: 0                       # 优先级加成
        reject-policy: REJECT                   # 并发满立即拒绝
        queue-timeout-seconds: 300              # 排队超时秒数
      background:
        max-concurrent: 2
        max-queue: 200
        weight: 10
        priority-boost: 0
        reject-policy: QUEUE                    # 并发满允许排队
        queue-timeout-seconds: 300

    # 交互式：进程内执行，不落作业表
    interactive:
      core-size: 4
      max-size: 16
      queue-capacity: 100                       # 线程池有界队列容量
      thread-name-prefix: sched-interactive-
    # 后台：落作业表，租约保证一作业一执行者
    background:
      core-size: 2
      max-size: 8
      queue-capacity: 500                       # 作业表 PENDING 上限（准入拒绝阈值）
      thread-name-prefix: sched-background-
    # 维护：Redis 单飞，跨实例同类作业只跑一份
    maintenance:
      core-size: 1
      max-size: 2
      queue-capacity: 50
      thread-name-prefix: sched-maintenance-

    single-flight:
      lock-ttl: 120s                            # 单飞锁 TTL（执行期间按心跳续约）
      retry-delay: 10s                          # 未抢到锁或 Redis 不可用时回 PENDING 的延迟

    # ===== 多副本能力（需先执行 sql/migrations/20261124/01_scheduler_instance.sql）=====
    instance-heartbeat-interval: ${WGH_SCHEDULER_INSTANCE_HEARTBEAT_INTERVAL:10s}   # 实例心跳写入间隔
    instance-liveness-ttl: ${WGH_SCHEDULER_INSTANCE_LIVENESS_TTL:45s}               # 失联阈值，建议 >= 3 倍心跳
    instance-sweep-interval: ${WGH_SCHEDULER_INSTANCE_SWEEP_INTERVAL:10s}           # 失联扫描间隔
    instance-retention: ${WGH_SCHEDULER_INSTANCE_RETENTION:7d}                      # 实例注册行保留时长

    # 作业状态与业务状态对账（SCHEDULER_RECONCILE，维护车道 + 周期作业）
    reconcile:
      enabled: ${WGH_SCHEDULER_RECONCILE_ENABLED:true}                 # 是否启用周期对账
      interval: ${WGH_SCHEDULER_RECONCILE_INTERVAL:10m}                # 对账间隔
      lookback: ${WGH_SCHEDULER_RECONCILE_LOOKBACK:24h}                # 只对账该时长内创建/更新的作业
      pending-grace: ${WGH_SCHEDULER_RECONCILE_PENDING_GRACE:5m}       # PENDING 超过该时长才自动取消
      batch-size: ${WGH_SCHEDULER_RECONCILE_BATCH_SIZE:200}            # 单类型单轮最多检查条数

    # 普通对话运行态登记（ChatRunProperties，前缀 wgh.scheduler.chat-run）
    # 对话结束即删除登记行；崩溃残留由回收器落终态后按保留期清理。
    chat-run:
      enabled: ${WGH_SCHEDULER_CHAT_RUN_ENABLED:true}                  # 关闭后「进行中任务」CHAT 页签为空
      lease-ttl: ${WGH_SCHEDULER_CHAT_RUN_LEASE_TTL:35m}               # 登记行租约 TTL（对话无周期心跳）
      terminal-retention: ${WGH_SCHEDULER_CHAT_RUN_TERMINAL_RETENTION:24h}   # 崩溃残留终态行保留时长

  # -------------------------------------------------------------------
  # 检索式长期记忆（RagProperties.Memory，前缀 wgh.rag.memory）
  # 今日新增：摘要与 TTL/容量清理；enabled/top-k/min-score/max-tokens 为既有项，不在此重复。
  # -------------------------------------------------------------------
  rag:
    memory:
      # ===== 摘要（AgentMemorySummarizer） =====
      llm-summary-enabled: false        # 是否用 LLM 生成记忆摘要；关闭或失败时回退截断
      # summary-model-id: 为空表示取第一个启用的对话模型；空值默认项保留在代码中
      summary-max-input-chars: 4000     # 送入摘要模型的原文最大字符数
      summary-max-tokens: 300           # 摘要输出 Token 上限
      fallback-summary-chars: 800       # 截断兜底最大字符数

      # ===== TTL / 容量清理（AgentMemoryCleaner） =====
      cleanup-enabled: true             # 是否启用记忆清理
      retention-days: 30                # 记忆保留天数（<=0 不按年龄清理）
      max-entries-per-scope: 200        # 单作用域最大条数（<=0 不按条数清理）
      cleanup-interval-minutes: 60      # 清理执行间隔（分钟，最小 5）
      cleanup-batch-size: 200           # 单次清理批量上限

    # -----------------------------------------------------------------
    # 存储运维（StorageMigrationProperties / StorageMigrationJobProperties /
    #           StorageOrphanCleanupProperties，前缀 wgh.rag.storage.*）
    # -----------------------------------------------------------------
    storage:
      # ===== local <-> oss 迁移执行参数（StorageMigrationProperties） =====
      migration:
        concurrency: 4                  # 并发搬运对象数（1~32）
        max-attempts: 3                 # 单对象最大尝试次数（含首次，1~10）
        retry-backoff-millis: 200       # 重试退避基数（线性递增，封顶 5 秒）
        max-failure-entries: 200        # 返回报告中保留的失败对象条数上限

        # ===== 异步作业状态 / 节流（StorageMigrationJobProperties） =====
        job-ttl-hours: 24               # 任务状态与取消标记 TTL（小时）
        progress-flush-interval-millis: 1000   # 进度合并写入间隔（毫秒）
        progress-flush-batch: 50        # 进度合并写入的对象数阈值
        cancel-check-interval-millis: 1000     # 执行实例检查取消标记的间隔（毫秒）
        index-limit: 50                 # 任务索引保留条数上限
        lock-ttl-seconds: 120           # 跨实例单飞锁 TTL（秒，最小 30）
        lock-renew-interval-seconds: 0  # 0 表示按 TTL/3 自动计算续约间隔

      # ===== 孤儿对象清理（StorageOrphanCleanupProperties） =====
      orphan-cleanup:
        enabled: true                   # 是否启用定期扫描（首次执行在一个间隔之后）
        delete: false                   # 默认仅报告；true 才真正删除孤儿对象
        interval-minutes: 1440          # 扫描间隔（分钟，最小 5）
        min-age-minutes: 60             # 删除保护期（分钟）：窗口内对象只报告不删除
        max-report-entries: 100         # 报告与逐条日志保留的孤儿 key 上限

    # -----------------------------------------------------------------
    # 配额扣费退款补偿（QuotaProperties.Charge，前缀 wgh.rag.quota.charge）
    # 扣费流水位于聊天主链路，部署前需先执行 sql/migrations/20261120/02_quota_charge.sql。
    # -----------------------------------------------------------------
    quota:
      charge:
        refund-enabled: true            # 是否启用退款补偿作业；关闭后不扫描流水
        refund-protection: 5m           # 已扣未决保护期：超过该时长仍未确认才补偿
        refund-scan-interval: 60s       # 补偿作业提交间隔（维护车道）
        refund-max-attempts: 5          # 单条流水最大退款尝试次数（含首次）
        refund-backoff: 60s             # 退款重试退避基数（按尝试次数指数递增）
        refund-backoff-max: 30m         # 退款重试退避上限
        refund-batch-size: 200          # 单次扫描最多处理的流水条数

  # -------------------------------------------------------------------
  # 代码沙箱（SandboxProperties，前缀 wgh.sandbox）
  # 默认关闭：enabled=false 时任何执行请求都会被拒绝。
  # work-root 默认空串（回退 ${java.io.tmpdir}/wgh-sandbox），空值项保留在代码中。
  # -------------------------------------------------------------------
  sandbox:
    enabled: false                      # 总开关，默认关闭
    default-timeout-ms: 5000            # 默认墙钟超时（毫秒）
    max-timeout-ms: 30000               # 允许的最大墙钟超时（毫秒）
    max-output-bytes: 65536             # stdout/stderr 合计输出上限（字节）
    max-code-bytes: 65536               # 单次提交代码最大字节数
    cpu-seconds: 5                      # CPU 时间上限（秒，ulimit -t）
    memory-mb: 256                      # 内存上限（MB，ulimit -v，尽力而为）
    max-file-bytes: 1048576             # 进程可写单文件上限（字节，ulimit -f）
    max-concurrent: 2                   # 同时执行的沙箱进程上限
    max-requests-per-minute: 10         # 每用户每分钟最多执行次数（进程内配额）
    allowed-languages:                  # 允许的语言（SandboxLanguage 名称）
      - PYTHON
      - JAVASCRIPT
    allow-network: false                # 是否允许子进程访问网络（默认拒绝）
    isolation: AUTO                     # AUTO / SANDBOX_EXEC / BWRAP / DEGRADED
    allow-degraded-isolation: false      # 是否允许退回弱隔离（临时目录 + ulimit）
    audit-to-database: true             # 是否把审计记录异步写入 wgh_audit_log

  # -------------------------------------------------------------------
  # 多 Agent 上下文预算（MultiAgentContextProperties，前缀 wgh.multi-agent.context）
  # 既有配置项（提交 2afd8ae），今日未修改默认值；按主题一并收敛，值等于代码默认值。
  # -------------------------------------------------------------------
  multi-agent:
    context:
      summary-max-tokens: 2000          # 汇总 prompt 的卡片预算 Tokens
      card-conclusion-max-tokens: 200   # 单张卡片结论预算 Tokens
      memory-max-messages: 6            # hasMemory 注入的最近消息条数
      memory-max-tokens: 1000           # hasMemory 注入的历史 Token 上限

  # -------------------------------------------------------------------
  # 工作流节点上下文预算（WorkflowContextProperties，前缀 wgh.workflow.context）
  # 既有配置项（提交 9be4a10 / f27704c），今日未修改默认值；按主题一并收敛。
  # -------------------------------------------------------------------
  workflow:
    context:
      node-prompt-max-ratio: 0.7        # LLM 节点输入预算占模型窗口比例
      fallback-context-window-tokens: 8192   # 模型未配置窗口时的兜底窗口（Tokens）
      node-output-max-bytes: 65536      # 单节点输出落库上限（字节）
      context-json-max-bytes: 262144    # context_json 落库总上限（字节）

  # -------------------------------------------------------------------
  # 向量后端与 chunk 事实层（VectorStoreProperties，前缀 wgh.vector）
  # 默认 pgvector + 事实层关闭：行为与引入端口化前完全一致。
  # -------------------------------------------------------------------
  vector:
    backend: pgvector                    # pgvector（默认）/ memory（仅开发测试）
    fact-layer-enabled: false            # 是否双写 wgh_kb_chunk 事实层
    fact-backfill-batch-size: 200        # 事实层回填单批条数

  # -------------------------------------------------------------------
  # 关键词后端（KeywordSearchProperties，前缀 wgh.search）
  # 默认 pgtrgm：行为与现有混合检索关键词路一致。
  # -------------------------------------------------------------------
  search:
    backend: pgtrgm                      # pgtrgm（默认）/ memory（仅开发测试）
    fallback-backend: pgtrgm             # 主后端异常时的降级后端
    degrade-on-error: true               # 允许关键词路异常时降级
    compare-enabled: false               # 双读对比：同一 query 两路都跑，只记差异不改变返回
    compare-backend: pgtrgm              # 双读对照后端（与主后端同名时跳过）
    gray-backend: ""                     # 灰度后端；留空表示未启用按 KB 白名单灰度
    gray-kb-ids: []                      # 灰度知识库白名单（KB ID）

  # -------------------------------------------------------------------
  # 多路召回融合（RetrievalFusionProperties，前缀 wgh.retrieval.fusion）
  # 默认 k=60、权重 1.0：与引入权重前完全一致。
  # -------------------------------------------------------------------
  retrieval:
    fusion:
      rrf-k: 60                          # RRF 常数 k
      vector-weight: 1.0                 # 向量路权重
      keyword-weight: 1.0                # 关键词路权重
