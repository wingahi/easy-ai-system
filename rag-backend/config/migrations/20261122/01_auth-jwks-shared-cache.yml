# =====================================================================
# 增量配置：多实例共享 JWKS 缓存（2026-11-22）
# ---------------------------------------------------------------------
# 目标文件：rag-backend/rag-app/src/main/resources/application.yml
# 分区：wgh.auth.oidc（今日新增 1 个键）
# 绑定类：com.wgh.rag.auth.security.OidcProperties
# 说明：增量覆盖片段，不参与自动加载；合并方式见 config/migrations/README.md
# 注意：共享缓存复用 wgh.rag.redis.*；Redis 不可用时自动回退本地缓存 + 回源
# =====================================================================
wgh:
  auth:
    oidc:
      # 多实例共享 JWKS 缓存；关闭后每实例独立回源（1.3.1 之前的行为）
      jwks-shared-cache-enabled: ${WGH_OIDC_JWKS_SHARED_CACHE:true}
