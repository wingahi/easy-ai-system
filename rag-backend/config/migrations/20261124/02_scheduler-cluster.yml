# =====================================================================
# 增量配置：调度中心多副本能力（2026-11-24）
# ---------------------------------------------------------------------
# 目标文件：rag-backend/rag-app/src/main/resources/application-features.yml
# 分区：scheduler（实例心跳 / 失联回收 / 作业-业务对账）
# 键数：9（全部为新增）
# 绑定类：com.wgh.rag.scheduler.config.SchedulerProperties
# 说明：增量覆盖片段，不参与自动加载；合并方式见 config/migrations/README.md
# 依赖：启用前必须先执行 sql/migrations/20261124/01_scheduler_instance.sql
# =====================================================================
wgh:
  scheduler:
    # 实例心跳写入间隔；多副本存活判定依赖该心跳
    instance-heartbeat-interval: 10s
    # 实例存活阈值：心跳超时即视为失联，其 LEASED/RUNNING 作业被提前回收
    # 必须显著大于心跳间隔（建议 >= 3 倍）
    instance-liveness-ttl: 45s
    # 失联实例扫描间隔；建议不大于存活阈值的一半
    instance-sweep-interval: 10s
    # 实例注册行保留时长（只影响管理端历史展示）
    instance-retention: 7d

    # 作业状态与业务状态对账（SCHEDULER_RECONCILE，维护车道 + 周期作业）
    reconcile:
      # 是否启用周期对账
      enabled: true
      # 对账间隔
      interval: 10m
      # 只对账最近该时长内创建/更新的作业，避免全表扫描
      lookback: 24h
      # PENDING 超过该时长仍与业务终态/缺失不一致时才自动取消，避免与刚提交的作业竞争
      pending-grace: 5m
      # 单类型单轮最多检查条数
      batch-size: 200
