# 说明：本地开发 + 容器化部署编排（含内置 PostgreSQL/pgvector）。
# 启动全部：cp .env.example .env && docker compose up -d --build
# 仅启动数据库/Redis：docker compose up -d postgres redis
# 停止：docker compose down（加 -v 会删除数据卷，含数据库数据）
services:
  # PostgreSQL + pgvector：镜像与项目既有环境一致（pg15），schema 要求 PostgreSQL 15+
  postgres:
    image: pgvector/pgvector:pg15
    container_name: wgh-rag-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wgh_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      # 数据文件放在子目录，便于卷与镜像升级
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化（数据卷为空）时按文件名顺序执行：扩展/建表 → 种子数据
      - ./rag-backend/sql/schema/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./rag-backend/sql/seed/02-data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    # 默认不映射宿主端口，避免生产误暴露；本地调试可临时用
    # docker compose run --rm --publish 5432:5432 postgres 覆盖

  redis:
    image: redis:8.10.1-alpine
    container_name: wgh-rag-redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${WGH_REDIS_PORT:-6379}:6379"
    volumes:
      - wgh-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./rag-backend
      dockerfile: Dockerfile
    image: wgh-rag-backend:local
    container_name: wgh-rag-backend
    # 管理端口 9090 只在容器网络内暴露给 Prometheus，不映射到宿主机
    ports:
      - "${WGH_BACKEND_PORT:-8080}:8080"
    environment:
      WGH_PROFILE: ${WGH_PROFILE:-prod}
      SERVER_PORT: 8080
      WGH_MANAGEMENT_PORT: 9090
      # 数据源唯一真相是 POSTGRES_*；应用侧统一用 SPRING_DATASOURCE_*（优先级最高）
      # 切外部库：把 POSTGRES_HOST/PORT/DB/USER/PASSWORD 指向外部实例即可
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-wgh_rag}?currentSchema=public&stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?必须设置 POSTGRES_PASSWORD}
      PROD_DB_POOL_MAX: ${PROD_DB_POOL_MAX:-50}
      WGH_REDIS_ENABLED: "true"
      WGH_REDIS_HOST: redis
      WGH_REDIS_PORT: 6379
      WGH_REDIS_PASSWORD: ${WGH_REDIS_PASSWORD:-}
      WGH_PGVECTOR_SKIP_EXT: ${WGH_PGVECTOR_SKIP_EXT:-false}
      # ===== 以下密钥生产环境必须注入，不得使用示例值 =====
      WGH_AUTH_LOCAL_JWT_SECRET: ${WGH_AUTH_LOCAL_JWT_SECRET:?必须设置 WGH_AUTH_LOCAL_JWT_SECRET}
      WGH_JWT_SECRET: ${WGH_JWT_SECRET:-}
      WGH_INIT_ADMIN_PASSWORD: ${WGH_INIT_ADMIN_PASSWORD:?必须设置 WGH_INIT_ADMIN_PASSWORD}
      WGH_OIDC_ISSUER: ${WGH_OIDC_ISSUER:-}
      WGH_OIDC_AUDIENCE: ${WGH_OIDC_AUDIENCE:-}
      WGH_OIDC_JWKS_URI: ${WGH_OIDC_JWKS_URI:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:MaxMetaspaceSize=256m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./rag-frontend
      dockerfile: Dockerfile
    image: wgh-rag-frontend:local
    container_name: wgh-rag-frontend
    ports:
      - "${WGH_FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: wgh-rag-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "${WGH_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - wgh-prometheus-data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: wgh-rag-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${WGH_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${WGH_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${WGH_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - wgh-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
  wgh-redis-data:
  wgh-prometheus-data:
  wgh-grafana-data:
