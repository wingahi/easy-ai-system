# K3 Secret 外置方案示例（Sealed Secrets），不参与 kustomization 渲染与校验。
#
# 现状：base/secret.example.yaml 只是模板，真实值需 `kubectl create secret` 手工注入，
# 无法进 Git，也无法审计与轮换。生产建议用 Sealed Secrets 做到「密文可入库」：
#
#   1. 集群安装 controller（一次性）：
#        helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
#        helm install sealed-secrets sealed-secrets/sealed-secrets -n kube-system
#   2. 本地安装 CLI 并取公钥：
#        brew install kubeseal
#        kubeseal --fetch-cert > wgh-pub.pem
#   3. 用真实值生成 Secret（不落盘到仓库）：
#        kubectl -n wgh create secret generic wgh-backend-secrets \
#          --from-literal=SPRING_DATASOURCE_PASSWORD='...' \
#          --from-literal=WGH_JWT_SECRET='...' \
#          --from-literal=WGH_AUTH_LOCAL_JWT_SECRET='...' \
#          --from-literal=WGH_INIT_ADMIN_PASSWORD='...' \
#          --from-literal=WGH_OSS_ACCESS_KEY_ID='...' \
#          --from-literal=WGH_OSS_ACCESS_KEY_SECRET='...' \
#          --dry-run=client -o yaml > /tmp/secret.yaml
#   4. 封存后只提交 SealedSecret：
#        kubeseal --cert wgh-pub.pem --format yaml < /tmp/secret.yaml > sealedsecret-backend.yaml
#        rm -f /tmp/secret.yaml
#   5. GitOps 只同步 sealedsecret-backend.yaml，controller 在集群内解密成同名 Secret。
#
# 轮换：重新执行第 3–4 步并提交新的 SealedSecret；SealedSecrets 默认不自动重启 Pod，
#   应用侧在启动时读取环境变量，因此 JWT / DB 密码轮换后仍需一次滚动重启
#   （`kubectl -n wgh rollout restart deploy/wgh-backend`，K3 的 maxUnavailable=0 保证不断流）。
#   数据库侧需用「双密码窗口」：先在 PG 增加新密码的角色凭据，再切换 Secret，最后回收旧凭据。
#
# 与 GitOps 的配合：Argo CD / Flux 只同步本仓库 + SealedSecret 清单，
#   业务 ConfigMap 与 Secret 均不出现在明文仓库中。
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wgh-backend-secrets
  namespace: wgh
spec:
  encryptedData:
    # 以下均为占位密文，必须用 kubeseal 重新生成；不要提交真实明文。
    SPRING_DATASOURCE_PASSWORD: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq（占位）
    WGH_JWT_SECRET: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq（占位）
    WGH_AUTH_LOCAL_JWT_SECRET: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq（占位）
    WGH_INIT_ADMIN_PASSWORD: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq（占位）
    WGH_OSS_ACCESS_KEY_ID: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq（占位）
    WGH_OSS_ACCESS_KEY_SECRET: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEq（占位）
  template:
    metadata:
      name: wgh-backend-secrets
      namespace: wgh
      labels:
        app.kubernetes.io/name: wgh-rag
        app.kubernetes.io/component: backend
    type: Opaque
