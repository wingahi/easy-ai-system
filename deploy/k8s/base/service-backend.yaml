# 服务名固定为 backend：前端镜像 nginx.conf 中 proxy_pass http://backend:8080 按此名解析。
# management 端口不经过 Ingress，仅供集群内 Prometheus / ServiceMonitor 抓取。
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: wgh-rag
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wgh-rag
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: management
      port: 9090
      targetPort: management
      protocol: TCP
