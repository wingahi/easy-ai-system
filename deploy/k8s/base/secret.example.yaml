# 敏感配置「模板」：不要直接 apply 本文件，也不要把真实值提交到仓库。
#
# 创建方式（任选其一）：
#   kubectl -n wgh create secret generic wgh-backend-secrets \
#     --from-literal=SPRING_DATASOURCE_PASSWORD='<db-password>' \
#     --from-literal=WGH_JWT_SECRET='<32+ chars>' \
#     --from-literal=WGH_AUTH_LOCAL_JWT_SECRET='<32+ chars>' \
#     --from-literal=WGH_INIT_ADMIN_PASSWORD='<initial-admin-password>'
#
# 或复制本文件为 secret.yaml、填入真实值后 apply（注意不要提交 secret.yaml）。
# 本文件刻意不加入 kustomization.yaml，避免用占位值覆盖线上真实密钥。
apiVersion: v1
kind: Secret
metadata:
  name: wgh-backend-secrets
  namespace: wgh
  labels:
    app.kubernetes.io/name: wgh-rag
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  # 数据库密码：应用按 SPRING_DATASOURCE_PASSWORD 读取；迁移 Job 也复用该键。
  SPRING_DATASOURCE_PASSWORD: "replace-me"
  # prod profile 必填：缺失会导致启动失败（application-prod.yml wgh.jwt.secret）。
  WGH_JWT_SECRET: "replace-me-with-at-least-32-characters"
  WGH_AUTH_LOCAL_JWT_SECRET: "replace-me-with-at-least-32-characters"
  # 首次启动创建管理员的初始密码。
  WGH_INIT_ADMIN_PASSWORD: "replace-me"
  # Redis 无密码时留空字符串；有密码时填入。
  WGH_REDIS_PASSWORD: ""
  # OSS 凭据（以下均为占位值，不是真实密钥，务必替换后再部署）。
  # K2 使用 WGH_STORAGE_TYPE=oss + WGH_STORAGE_MODE=shared：
  #   缺 endpoint/bucket/accessKeyId/accessKeySecret 任一项时，shared 启动自检会让容器启动失败，
  #   不会带病提供上传服务。
  WGH_OSS_ACCESS_KEY_ID: "REPLACE_ME_OSS_ACCESS_KEY_ID"
  WGH_OSS_ACCESS_KEY_SECRET: "REPLACE_ME_OSS_ACCESS_KEY_SECRET"
