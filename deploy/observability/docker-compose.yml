# 独立观测栈：Prometheus + Grafana + 调度作业 Postgres 导出器。
# 不包含 postgres/redis/backend，复用既有运行中的容器与网络，避免重启业务。
#
# 启动（在仓库根目录执行）：
#   docker compose --env-file .env -f deploy/observability/docker-compose.yml up -d
# 停止（只停本栈）：
#   docker compose --env-file .env -f deploy/observability/docker-compose.yml down
name: wgh-rag-observability

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: wgh-observability-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # 保留周期（与告警窗口/磁盘容量匹配，可按需调整）
      - "--storage.tsdb.retention.time=${WGH_PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:${WGH_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules:/etc/prometheus/rules:ro
      - wgh-observability-prometheus-data:/prometheus
    networks:
      - observability
      - wgh-rag
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: wgh-observability-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${WGH_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${WGH_GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 关闭匿名访问，避免面板被无意公开
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:${WGH_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - wgh-observability-grafana-data:/var/lib/grafana
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

  # 将 wgh_execution_job 表按 status/lane 聚合为 Prometheus 指标，
  # 用于调度队列/死信告警；只读查询，不修改业务数据。
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.21.1
    container_name: wgh-observability-pg-exporter
    command:
      - "--extend.query-path=/etc/postgres_exporter/queries.yml"
    environment:
      # 凭据只经环境变量注入，不写入文件
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-wgh_rag_prod}?sslmode=disable"
    ports:
      - "127.0.0.1:${WGH_PG_EXPORTER_PORT:-19187}:9187"
    volumes:
      - ./postgres-exporter/queries.yml:/etc/postgres_exporter/queries.yml:ro
    networks:
      - wgh-rag
    restart: unless-stopped

volumes:
  wgh-observability-prometheus-data:
  wgh-observability-grafana-data:

networks:
  observability:
    name: wgh-rag-observability
  # 既有业务容器所在网络（postgres/redis/backend），仅加入不修改
  wgh-rag:
    external: true
    name: ${WGH_EXISTING_NETWORK:-wgh-rag-system_default}
